<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#1b1610"/>
  <!-- eight-pointed star (khatam): two squares, one turned 45° -->
  <g fill="#e8710a">
    <rect x="22" y="22" width="56" height="56"/>
    <rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/>
  </g>
  <!-- cut-out ring and core -->
  <rect x="38" y="38" width="24" height="24" transform="rotate(45 50 50)" fill="#1b1610"/>
  <rect x="45" y="45" width="10" height="10" transform="rotate(45 50 50)" fill="#f5eddd"/>
</svg>
